<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Market Maker Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    margin: 0;
    padding: 24px;
  }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
  .stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat {
    background: #171a21;
    border: 1px solid #262a33;
    border-radius: 8px;
    padding: 12px 16px;
  }
  .stat .label { font-size: 11px; color: #8a8f98; text-transform: uppercase; }
  .stat .value { font-size: 20px; font-weight: 600; margin-top: 4px; }
  .pnl-pos { color: #4ade80; }
  .pnl-neg { color: #f87171; }
  canvas { background: #171a21; border-radius: 8px; padding: 8px; }
  .chart-wrap { position: relative; height: 260px; margin-bottom: 20px; }
  .chart-wrap.short { height: 180px; }
  .controls {
    background: #171a21;
    border: 1px solid #262a33;
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }
  .controls h2 { font-size: 13px; font-weight: 600; margin: 0 0 10px 0; color: #b5bac3; }
  .controls-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; margin-bottom: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: #8a8f98; text-transform: uppercase; }
  .field input, .field select {
    background: #0f1115;
    border: 1px solid #262a33;
    border-radius: 6px;
    color: #e6e6e6;
    padding: 6px 8px;
    font-size: 13px;
  }
  .field input[type=number] { width: 90px; }
  .field input[type=text] { width: 220px; }
  #apply-btn {
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  #apply-btn:hover { background: #1d4ed8; }
  #apply-status { font-size: 12px; color: #8a8f98; margin-left: 10px; }
</style>
</head>
<body>
  <h1>Market Maker Dashboard</h1>
  <div id="source" style="font-size:12px;color:#8a8f98;margin-bottom:12px;">-</div>

  <div class="stats">
    <div class="stat"><div class="label">Time remaining</div><div class="value" id="time">-</div></div>
    <div class="stat"><div class="label">Inventory</div><div class="value" id="inventory">-</div></div>
    <div class="stat"><div class="label">Bid / Ask</div><div class="value" id="quotes">-</div></div>
    <div class="stat"><div class="label">Cash</div><div class="value" id="cash">-</div></div>
    <div class="stat"><div class="label">P&amp;L</div><div class="value" id="pnl">-</div></div>
  </div>

  <div class="chart-wrap"><canvas id="priceChart"></canvas></div>
  <div class="chart-wrap short"><canvas id="depthChart"></canvas></div>
  <div class="chart-wrap short"><canvas id="inventoryChart"></canvas></div>

  <div class="controls">
    <h2>Model parameters (restarts the simulation on Apply)</h2>
    <div class="controls-row">
      <div class="field">
        <label>Source</label>
        <select id="ctl-source">
          <option value="synthetic">Synthetic</option>
          <option value="historical">Historical CSV</option>
        </select>
      </div>
      <div class="field">
        <label>CSV path</label>
        <input type="text" id="ctl-csv" value="data/aapl.csv" />
      </div>
      <div class="field">
        <label>gamma</label>
        <input type="number" id="ctl-gamma" value="0.1" step="0.01" min="0.01" max="2" />
      </div>
      <div class="field">
        <label>sigma</label>
        <input type="number" id="ctl-sigma" value="2.0" step="0.1" min="0.1" max="10" />
      </div>
      <div class="field">
        <label>A</label>
        <input type="number" id="ctl-A" value="140" step="1" min="1" max="500" />
      </div>
      <div class="field">
        <label>k</label>
        <input type="number" id="ctl-k" value="1.5" step="0.1" min="0.1" max="10" />
      </div>
    </div>
    <div class="controls-row">
      <div class="field">
        <label>book levels</label>
        <input type="number" id="ctl-book_levels" value="10" step="1" min="2" max="30" />
      </div>
      <div class="field">
        <label>tick size</label>
        <input type="number" id="ctl-tick_size" value="0.25" step="0.01" min="0.01" max="1" />
      </div>
      <div class="field">
        <label>base level volume</label>
        <input type="number" id="ctl-base_level_volume" value="8" step="0.5" min="1" max="50" />
      </div>
      <div class="field">
        <label>replenish rate</label>
        <input type="number" id="ctl-replenish_rate" value="2" step="0.1" min="0.1" max="10" />
      </div>
      <button id="apply-btn">Apply</button>
      <span id="apply-status"></span>
    </div>
  </div>

  <script>
    const priceCtx = document.getElementById('priceChart').getContext('2d');
    const invCtx = document.getElementById('inventoryChart').getContext('2d');

    const priceChart = new Chart(priceCtx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          { label: 'Mid', data: [], borderColor: '#e6e6e6', pointRadius: 0, borderWidth: 1.5 },
          { label: 'Bid', data: [], borderColor: '#4ade80', pointRadius: 0, borderWidth: 1 },
          { label: 'Ask', data: [], borderColor: '#f87171', pointRadius: 0, borderWidth: 1 },
        ]
      },
      options: {
        animation: false,
        responsive: true,
        maintainAspectRatio: false,
        scales: { x: { display: false }, y: { ticks: { color: '#8a8f98' } } },
        plugins: { legend: { labels: { color: '#e6e6e6' } } }
      }
    });

    const inventoryChart = new Chart(invCtx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          { label: 'Inventory', data: [], borderColor: '#60a5fa', pointRadius: 0, borderWidth: 1.5 },
          { label: 'P&L', data: [], borderColor: '#fbbf24', pointRadius: 0, borderWidth: 1.5, yAxisID: 'y1' },
        ]
      },
      options: {
        animation: false,
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { display: false },
          y: { ticks: { color: '#8a8f98' } },
          y1: { position: 'right', ticks: { color: '#8a8f98' }, grid: { drawOnChartArea: false } }
        },
        plugins: { legend: { labels: { color: '#e6e6e6' } } }
      }
    });

    const depthCtx = document.getElementById('depthChart').getContext('2d');
    const depthChart = new Chart(depthCtx, {
      type: 'bar',
      data: {
        labels: [],
        datasets: [
          { label: 'Bid depth', data: [], backgroundColor: '#4ade8099', borderRadius: 2 },
          { label: 'Ask depth', data: [], backgroundColor: '#f8717199', borderRadius: 2 },
        ]
      },
      options: {
        animation: false,
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { ticks: { color: '#8a8f98' }, grid: { display: false } },
          y: { ticks: { color: '#8a8f98' } }
        },
        plugins: { legend: { labels: { color: '#e6e6e6' } } }
      }
    });

    const controlIds = [
      'ctl-source', 'ctl-csv', 'ctl-gamma', 'ctl-sigma', 'ctl-A', 'ctl-k',
      'ctl-book_levels', 'ctl-tick_size', 'ctl-base_level_volume', 'ctl-replenish_rate'
    ];
    let controlsTouched = false;
    for (const id of controlIds) {
      document.getElementById(id).addEventListener('input', () => { controlsTouched = true; });
    }

    function syncControlsFromState(state) {
      if (controlsTouched) return; // don't clobber values the user is editing
      document.getElementById('ctl-source').value = state.source;
      document.getElementById('ctl-csv').value = state.csv || 'data/aapl.csv';
      document.getElementById('ctl-gamma').value = state.gamma;
      document.getElementById('ctl-sigma').value = state.sigma;
      document.getElementById('ctl-A').value = state.A;
      document.getElementById('ctl-k').value = state.k;
      document.getElementById('ctl-book_levels').value = state.book_levels;
      document.getElementById('ctl-tick_size').value = state.tick_size;
      document.getElementById('ctl-base_level_volume').value = state.base_level_volume;
      document.getElementById('ctl-replenish_rate').value = state.replenish_rate;
    }

    document.getElementById('apply-btn').addEventListener('click', async () => {
      const statusEl = document.getElementById('apply-status');
      const payload = {
        seq: Date.now(),
        source: document.getElementById('ctl-source').value,
        csv: document.getElementById('ctl-csv').value,
        gamma: parseFloat(document.getElementById('ctl-gamma').value),
        sigma: parseFloat(document.getElementById('ctl-sigma').value),
        A: parseFloat(document.getElementById('ctl-A').value),
        k: parseFloat(document.getElementById('ctl-k').value),
        book_levels: parseInt(document.getElementById('ctl-book_levels').value, 10),
        tick_size: parseFloat(document.getElementById('ctl-tick_size').value),
        base_level_volume: parseFloat(document.getElementById('ctl-base_level_volume').value),
        replenish_rate: parseFloat(document.getElementById('ctl-replenish_rate').value),
      };
      statusEl.textContent = 'Applying...';
      try {
        const res = await fetch('/control', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        statusEl.textContent = res.ok ? 'Applied.' : 'Failed to apply.';
        controlsTouched = false;
      } catch (e) {
        statusEl.textContent = 'Failed to reach server.';
      }
      setTimeout(() => { statusEl.textContent = ''; }, 2500);
    });

    async function poll() {
      try {
        const [stateRes, historyRes] = await Promise.all([
          fetch('state.json', { cache: 'no-store' }),
          fetch('history.json', { cache: 'no-store' })
        ]);
        const state = await stateRes.json();
        const history = await historyRes.json();

        document.getElementById('source').textContent =
          state.source === 'historical' ? `Source: historical (${state.csv})` : 'Source: synthetic';
        if (state.error) {
          document.getElementById('source').textContent += ` — error: ${state.error}`;
        }
        syncControlsFromState(state);
        document.getElementById('time').textContent = state.time_remaining.toFixed(3);
        document.getElementById('inventory').textContent = state.inventory.toFixed(0);
        document.getElementById('quotes').textContent =
          state.bid.toFixed(2) + ' / ' + state.ask.toFixed(2);
        document.getElementById('cash').textContent = state.cash.toFixed(2);

        const pnlEl = document.getElementById('pnl');
        pnlEl.textContent = state.pnl.toFixed(2);
        pnlEl.className = 'value ' + (state.pnl >= 0 ? 'pnl-pos' : 'pnl-neg');

        const labels = history.map((_, i) => i);
        priceChart.data.labels = labels;
        priceChart.data.datasets[0].data = history.map(f => f.mid_price);
        priceChart.data.datasets[1].data = history.map(f => f.bid);
        priceChart.data.datasets[2].data = history.map(f => f.ask);
        priceChart.update('none');

        const bidPricesAsc = [...(state.bid_book_prices || [])].reverse();
        const bidVolumesAsc = [...(state.bid_book_volumes || [])].reverse();
        const askPricesAsc = state.ask_book_prices || [];
        const askVolumesAsc = state.ask_book_volumes || [];
        const depthLabels = [...bidPricesAsc, ...askPricesAsc].map(p => p.toFixed(2));
        depthChart.data.labels = depthLabels;
        depthChart.data.datasets[0].data = [...bidVolumesAsc, ...askPricesAsc.map(() => null)];
        depthChart.data.datasets[1].data = [...bidPricesAsc.map(() => null), ...askVolumesAsc];
        depthChart.update('none');

        inventoryChart.data.labels = labels;
        inventoryChart.data.datasets[0].data = history.map(f => f.inventory);
        inventoryChart.data.datasets[1].data = history.map(f => f.pnl);
        inventoryChart.update('none');
      } catch (e) {
        // No data yet — the runner may not have started.
      }
    }

    setInterval(poll, 200);
    poll();
  </script>
</body>
</html>
